name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  check:
    name: Check test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: './components/WalletEngine/reference/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Set up credentials
        run: |
          echo '//npm.pkg.github.com/:_authToken=${{ secrets.MIDNIGHTCI_PACKAGES_READ }}' > ${HOME}/.npmrc

      - name: Install dependencies
        run: |
          cd ./components/WalletEngine/reference
          npm install --ignore-scripts

      - name: Cleanup auth setup
        run: "rm -f ${HOME}/.npmrc"

      - name: Run postinstall scripts
        run: |
          cd ./components/WalletEngine/reference
          npm rebuild
          npm run prepare --if-present

      - name: Test reference implementation
        run: |
          cd ./components/WalletEngine/reference/
          npm run test
